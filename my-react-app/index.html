<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <title>Intra Assets - Light Without Borders</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: white;
        font-family: 'Space Grotesk', sans-serif;
      }

      #preloader {
        position: fixed;
        inset: 0;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.4s ease-out;
      }

      #preloader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      #root {
        opacity: 0;
        transition: opacity 0.2s ease-out;
      }

      #root.ready {
        opacity: 1;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f0f0f0;
        border-top: 4px solid #f5c518;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="spinner"></div>
    </div>

    <div id="root">
      <!-- Optional: можно вставить сюда базовый заглушечный HTML, если хочешь SSR-like эффект -->
    </div>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const root = document.getElementById('root');
        root.classList.add('ready');
      });

      window.addEventListener('load', () => {
        const preloader = document.getElementById('preloader');
        preloader.classList.add('fade-out');
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
